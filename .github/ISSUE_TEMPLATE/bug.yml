name: Bug report
description: Report a reproducible non-security defect
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities or policy bypasses, use the private security reporting path described in SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
